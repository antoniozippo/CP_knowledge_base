#
# Source: textbook pharmacology, entered by hand (Claude, 2026-11-27) because ChEMBL could not be
# reached from the build environment. Only compounds with a well-established primary target are
# listed; natural products, mixtures, formulations and research compounds with unclear targets are
# left out on purpose. Check every entry against ChEMBL mechanisms before relying on it.
#
# <graph node id>: [{target: <HGNC symbol or graph node id>, action: <...>, sign: +1 activates / -1 inhibits}]

