# Explicit assignments of graph nodes to canonical nodes, applied before the automatic rules in
# analysis/scripts/build_canonical.py (gene symbols from labels, pain behaviour to PAIN).
#
# map:      graph node id -> canonical id (a gene symbol, a readout id, or another graph node id)
# unmapped: graph node ids the automatic rules must leave alone (their label names a gene, but the
#           node is something else: a variant, a pathway, a cell population)
#
# These are judgement calls made while building the network (2026-11-27), not expert decisions.

map:
  # microglia as a cell population and microglial activation: one activity node
  shared_microglia: MICROGLIA
  CSF1-CSF1R_SpinalMicroglia: MICROGLIA
  CRAWLED_microglial_activation: MICROGLIA
  CRAWLED_microglia_activation: MICROGLIA
  # duplicate TNF-alpha nodes from different dossiers
  GABA_apoptosis_TNF_alpha: TNF
  shared_tnfa: TNF

unmapped:
  - CRAWLED_cgrp            # labelled "CGRP(8-37)", an antagonist fragment, not CGRP
  # Kalirin-7 pools split by region on purpose (analysis/claims/node_splits.yaml and the dossier):
  # only the main node (karilin7_Kalirin7, the spinal pronociceptive pool) becomes KALRN
  - karilin7_Kalirin7_ACC
  - karilin7_Hippocampus
  - karilin7_Amygdala_CeA
  - karilin7_SpinalDorsalHorn
  - karilin7_DRG
  - karilin7_Kalirin7_KO
  - karilin7_AAV_Kalirin7
  - karilin7_shRNA_Kalirin7

# names that label-to-symbol resolution cannot derive (normalized: upper case, no punctuation, Greek
# letters spelled as their Latin initial) -> HGNC symbol. crawler/aliases.yaml is read as well.
