<title>Pain Graph Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working column. A search box leads, the selected node's verdict and its evidence follow,
   and two more tabs hold the precomputed findings and the reading guide.
   Palette: cool slate ground, cobalt for what you can press, and two signal hues that mean one thing
   everywhere: rust = raises pain, teal = lowers pain. */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --surface-2: #e9eff1; --ink: #132029; --muted: #566772; --line: #d3dce1;
  --accent: #2250b8; --accent-soft: #e1e9fb;
  --lowers: #13707f; --lowers-soft: #d9eff2; --raises: #a83d27; --raises-soft: #f7e2dc;
  --warn: #7a5d00; --warn-soft: #f5ecc9;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1418; --surface: #141d23; --surface-2: #1b2830; --ink: #e5edf1; --muted: #93a5b0; --line: #2a3a44;
  --accent: #86a9ff; --accent-soft: #1a2845;
  --lowers: #5cc2d2; --lowers-soft: #11323a; --raises: #f19079; --raises-soft: #3a1f19;
  --warn: #e4c65c; --warn-soft: #33300f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1418; --surface: #141d23; --surface-2: #1b2830; --ink: #e5edf1; --muted: #93a5b0; --line: #2a3a44;
  --accent: #86a9ff; --accent-soft: #1a2845;
  --lowers: #5cc2d2; --lowers-soft: #11323a; --raises: #f19079; --raises-soft: #3a1f19;
  --warn: #e4c65c; --warn-soft: #33300f; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-ui); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
header { display: grid; gap: 6px; }
header p { color: var(--muted); }
.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 14px; max-width: none; }
.banner b { color: var(--warn); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.panel { display: grid; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
/* search */
.search { position: relative; display: grid; gap: 10px; }
.search input { width: 100%; font: inherit; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.results { position: absolute; top: 50px; left: 0; right: 0; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 360px; overflow-y: auto; list-style: none; margin: 0; padding: 4px; }
.results li { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover { background: var(--accent-soft); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
/* badges */
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: 500 11px/1 var(--font-data); letter-spacing: 0.03em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.cur { background: var(--accent-soft); color: var(--accent); }
.tag.unrev { background: var(--warn-soft); color: var(--warn); }
.tag.lowers { background: var(--lowers-soft); color: var(--lowers); }
.tag.raises { background: var(--raises-soft); color: var(--raises); }
/* verdict */
.verdict { display: grid; gap: 14px; }
.verdict .line { font-size: 19px; font-weight: 500; line-height: 1.35; max-width: 60ch; }
.verdict .line.lowers { color: var(--lowers); } .verdict .line.raises { color: var(--raises); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; border-left: 2px solid var(--line); padding-left: 10px; }
.stat b { font: 500 22px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
/* diverging chart */
.chartwrap { overflow-x: auto; }
svg.chart { display: block; width: 100%; min-width: 520px; max-width: 760px; height: auto; }
svg .t { fill: var(--ink); font: 12px var(--font-ui); } svg .tm { fill: var(--muted); font: 11px var(--font-data); }
svg .ax { stroke: var(--line); stroke-width: 1; } svg .zero { stroke: var(--muted); stroke-width: 1; }
svg .barL { fill: var(--lowers); } svg .barR { fill: var(--raises); } svg .barA { fill: var(--accent); }
/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 600 11px/1.2 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
th.num { text-align: right; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.link:hover { text-decoration-color: currentColor; }
/* paths */
.path { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: grid; }
.path > header { padding: 12px 14px; display: grid; gap: 8px; }
.pathhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chain { display: flex; gap: 6px 4px; align-items: center; flex-wrap: wrap; }
.node { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 14px; max-width: 100%; text-align: left; }
.node:hover { border-color: var(--accent); }
.node.end { background: var(--accent-soft); }
.arrow { font: 500 12px var(--font-data); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.arrow.raises { color: var(--raises); } .arrow.lowers { color: var(--lowers); }
.path details { border-top: 1px solid var(--line); }
.path summary { cursor: pointer; padding: 8px 14px; font-size: 13px; color: var(--muted); }
.path summary:hover { color: var(--ink); }
.evs { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 12px; }
.ev { display: grid; gap: 4px; padding-left: 12px; border-left: 3px solid var(--line); }
.ev.raises { border-left-color: var(--raises); } .ev.lowers { border-left-color: var(--lowers); }
.ev-top { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.ev blockquote { margin: 0; font-size: 13px; color: var(--muted); max-width: 80ch; }
.ev .src { font: 12px var(--font-data); color: var(--muted); }
.meter { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--muted); }
/* misc */
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }
.section-title { display: grid; gap: 4px; }
.empty { color: var(--muted); padding: 24px 0; }
.big3 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.big3 .card b.n { font: 500 34px/1 var(--font-data); font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 76ch; }
.loopline { display: flex; gap: 4px 6px; flex-wrap: wrap; align-items: center; }
.theme { position: absolute; right: 0; top: 0; }
@media (prefers-reduced-motion: no-preference) { .results, .path { animation: rise .14s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } } }
</style>

<div class="wrap">
  <header>
    <h1>Pain Graph Explorer</h1>
    <p id="subtitle">Loading the graph…</p>
  </header>
  <p class="banner"><b>Read every result as a hypothesis.</b> Most links come from crawled papers nobody has reviewed yet. Open a path to see the quote behind each link.</p>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-explore" aria-selected="true" aria-controls="panel-explore" data-tab="explore">Explore a node</button>
    <button role="tab" id="tab-findings" aria-selected="false" aria-controls="panel-findings" data-tab="findings">Findings</button>
    <button role="tab" id="tab-guide" aria-selected="false" aria-controls="panel-guide" data-tab="guide">How to read it</button>
  </nav>

  <section class="panel" id="panel-explore" role="tabpanel" aria-labelledby="tab-explore">
    <div class="search">
      <label for="q" class="muted" style="font-size:13px">Search a drug, target, cell or pathway</label>
      <input id="q" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" placeholder="for example morphine, NLRP3, TRPV1, electroacupuncture" disabled>
      <ul class="results" id="results" role="listbox" hidden></ul>
      <div class="chips" id="examples"><span class="muted" style="font-size:13px">Try</span></div>
    </div>
    <div id="detail"></div>
  </section>
  <section class="panel" id="panel-findings" role="tabpanel" aria-labelledby="tab-findings" hidden></section>
  <section class="panel" id="panel-guide" role="tabpanel" aria-labelledby="tab-guide" hidden></section>
</div>

<script>
(function () {
  'use strict';
  var N = [], E = [], F = null, out = [], inn = [], dist = [], deg = [], core = new Set();
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var short = function (label) { return label.split(' (')[0]; };
  var f1 = function (x) { return (x < 0 ? '−' : x > 0 ? '+' : '') + Math.abs(x).toFixed(1); };
  var pct = function (a, b) { return b ? Math.round(100 * a / b) + '%' : 'n/a'; };
  var isDrug = function (i) { return (N[i][4] & 1) !== 0; };
  var isPain = function (i) { return (N[i][4] & 4) !== 0; };

  /* ---------- the same algorithm as analysis/scripts/graph_inference.py ---------- */
  function buildIndex() {
    out = N.map(function () { return []; }); inn = N.map(function () { return []; }); deg = N.map(function () { return 0; });
    E.forEach(function (e, k) { out[e[0]].push(k); inn[e[1]].push(k); deg[e[0]]++; deg[e[1]]++; });
    core = new Set(F.meta.core);
    dist = new Array(N.length);
    var frontier = F.meta.core.slice();
    frontier.forEach(function (c) { dist[c] = 0; });
    while (frontier.length) {
      var next = [];
      frontier.forEach(function (node) { inn[node].forEach(function (k) { var s = E[k][0]; if (dist[s] === undefined) { dist[s] = dist[node] + 1; next.push(s); } }); });
      frontier = next;
    }
  }
  function pathSign(p) { var s = 1; for (var j = 0; j < p.length; j++) s *= E[p[j]][2]; return s; }
  function pathWeight(p) { var w = Math.pow(F.meta.decay, p.length - 1); for (var j = 0; j < p.length; j++) w *= E[p[j]][3]; return w; }
  function enumPaths(start, maxLen) {
    var res = [], stack = [];
    if (dist[start] === undefined || core.has(start)) return res;
    var visited = new Uint8Array(N.length); visited[start] = 1;
    (function walk(node) {
      var edges = out[node];
      for (var a = 0; a < edges.length; a++) {
        var k = edges[a], nxt = E[k][1];
        if (visited[nxt]) continue;
        if (core.has(nxt)) { res.push(stack.concat(k)); continue; }
        var left = maxLen - stack.length - 1;
        if (left < 1 || isDrug(nxt) || (dist[nxt] === undefined ? 99 : dist[nxt]) > left) continue;
        visited[nxt] = 1; stack.push(k); walk(nxt); stack.pop(); visited[nxt] = 0;
      }
    })(start);
    return res;
  }
  function analyze(i) {
    var drug = isDrug(i), maxLen = drug ? F.meta.max_len : F.meta.target_len, paths = enumPaths(i, maxLen);
    var per = new Map();
    paths.forEach(function (p) { var o = E[p[p.length - 1]][1]; per.set(o, (per.get(o) || 0) + pathSign(p) * pathWeight(p)); });
    var score = 0, neg = 0, pos = 0;
    per.forEach(function (v) { score += Math.tanh(v); if (v < -0.05) neg++; if (v > 0.05) pos++; });
    var dominant = score < 0 ? -1 : 1, med = new Set();
    paths.forEach(function (p) { if (p.length > 1 && pathSign(p) === dominant) med.add(E[p[0]][1]); });
    var dir = new Set(); out[i].forEach(function (k) { if (isPain(E[k][1])) dir.add(E[k][2]); });
    return { i: i, drug: drug, score: score, neg: neg, pos: pos, per: per, paths: paths, mediators: med.size,
             direct: Array.from(dir).sort(function (a, b) { return a - b; }), agreement: neg + pos ? Math.max(neg, pos) / (neg + pos) : 0 };
  }

  /* ---------- rendering helpers ---------- */
  function nodeBtn(i, cls) { return '<button class="node ' + (cls || '') + '" data-node="' + i + '" title="' + esc(N[i][1]) + '">' + esc(short(N[i][1])) + '</button>'; }
  function nodeLink(i) { return '<button class="link" data-node="' + i + '">' + esc(short(N[i][1])) + '</button>'; }
  function role(i) { var f = N[i][4], r = []; if ((f & 1) && N[i][2] !== 'drug') r.push('drug'); if (f & 4) r.push('pain outcome'); else if (f & 2) r.push('inducer'); return r; }
  function srcHtml(e) {
    var m = /^PMID (\d+)$/.exec(e[5]);
    var base = m ? 'PMID <a href="https://pubmed.ncbi.nlm.nih.gov/' + m[1] + '/" target="_blank" rel="noopener">' + m[1] + '</a>' : esc(e[5]);
    return base + (e[8] > 0 ? ' +' + e[8] + ' more paper' + (e[8] > 1 ? 's' : '') : '');
  }
  function evidence(k) {
    var e = E[k], cls = e[2] > 0 ? 'raises' : 'lowers', status = e[7];
    var tagCls = status === 'unreviewed' ? 'unrev' : 'cur';
    return '<li class="ev ' + cls + '"><div class="ev-top">' + nodeLink(e[0]) + '<span class="arrow ' + cls + '">' + (e[2] > 0 ? 'raises' : 'lowers') + '</span>' + nodeLink(e[1]) +
      '<span class="tag ' + tagCls + '">' + esc(status) + '</span><span class="meter" title="link weight ' + e[3].toFixed(2) + '"><i style="width:' + Math.round(e[3] * 100) + '%"></i></span></div>' +
      '<div class="src">' + srcHtml(e) + '</div>' + (e[6] ? '<blockquote>“' + esc(e[6]) + '”</blockquote>' : '') + '</li>';
  }
  function chain(p) {
    var h = nodeBtn(E[p[0]][0]);
    p.forEach(function (k, j) { var e = E[k]; h += '<span class="arrow ' + (e[2] > 0 ? 'raises' : 'lowers') + '" title="' + (e[2] > 0 ? 'raises' : 'lowers') + '">' + (e[2] > 0 ? '→' : '⊣') + '</span>' + nodeBtn(e[1], j === p.length - 1 ? 'end' : ''); });
    return h;
  }
  function pathCard(p, open) {
    var s = pathSign(p), end = E[p[p.length - 1]][1];
    var curated = p.filter(function (k) { return E[k][4] === 1; }).length;
    return '<article class="path"><header><div class="pathhead"><span class="tag ' + (s < 0 ? 'lowers' : 'raises') + '">' + (s < 0 ? 'lowers' : 'raises') + ' ' + esc(short(N[end][1])) + '</span>' +
      '<span>' + p.length + ' link' + (p.length > 1 ? 's' : '') + '</span><span>weight <span class="mono">' + pathWeight(p).toFixed(2) + '</span></span><span>' + curated + ' of ' + p.length + ' curated</span></div>' +
      '<div class="chain">' + chain(p) + '</div></header><details' + (open ? ' open' : '') + '><summary>Evidence for each link</summary><ul class="evs">' + p.map(evidence).join('') + '</ul></details></article>';
  }
  function chartOutcomes(a) {
    var rows = F.meta.core.map(function (c) { return { c: c, v: a.per.has(c) ? Math.tanh(a.per.get(c)) : null }; })
      .sort(function (x, y) { return (y.v === null ? -9 : Math.abs(y.v)) - (x.v === null ? -9 : Math.abs(x.v)) || x.c - y.c; });
    var labelW = 250, plotW = 360, rowH = 24, top = 22, W = labelW + plotW + 60, H = top + rows.length * rowH + 22, zero = labelW + plotW / 2, half = plotW / 2 - 6;
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Effect on each core pain node, from lowers pain on the left to raises pain on the right">';
    [-1, -0.5, 0, 0.5, 1].forEach(function (t) { var x = zero + t * half; svg += '<line class="' + (t === 0 ? 'zero' : 'ax') + '" x1="' + x + '" x2="' + x + '" y1="' + (top - 6) + '" y2="' + (H - 18) + '"/><text class="tm" x="' + x + '" y="' + (H - 4) + '" text-anchor="middle">' + (t > 0 ? '+' : t < 0 ? '−' : '') + Math.abs(t) + '</text>'; });
    svg += '<text class="tm" x="' + (zero - half) + '" y="10">← lowers pain</text><text class="tm" x="' + (zero + half) + '" y="10" text-anchor="end">raises pain →</text>';
    rows.forEach(function (r, j) {
      var y = top + j * rowH, lab = short(N[r.c][1]); if (lab.length > 38) lab = lab.slice(0, 37) + '…';
      svg += '<text class="t" x="' + (labelW - 8) + '" y="' + (y + 14) + '" text-anchor="end">' + esc(lab) + '</text>';
      if (r.v === null) svg += '<text class="tm" x="' + (zero + 6) + '" y="' + (y + 14) + '">no path</text>';
      else { var w = Math.abs(r.v) * half, x = r.v < 0 ? zero - w : zero; svg += '<rect class="' + (r.v < 0 ? 'barL' : 'barR') + '" x="' + x + '" y="' + (y + 3) + '" width="' + Math.max(w, 1) + '" height="' + (rowH - 8) + '" rx="2"><title>' + esc(N[r.c][1]) + ': ' + r.v.toFixed(2) + '</title></rect>'; }
    });
    return '<div class="chartwrap">' + svg + '</svg></div>';
  }

  /* ---------- explore ---------- */
  function neighbours(i, dir) {
    var list = (dir === 'out' ? out[i] : inn[i]).slice().sort(function (a, b) { return E[b][3] - E[a][3] || a - b; });
    if (!list.length) return '<p class="note">None.</p>';
    var rows = list.slice(0, 12).map(function (k) {
      var e = E[k], other = dir === 'out' ? e[1] : e[0];
      return '<tr><td>' + nodeLink(other) + '</td><td><span class="arrow ' + (e[2] > 0 ? 'raises' : 'lowers') + '">' + (e[2] > 0 ? 'raises' : 'lowers') + '</span></td><td class="num">' + e[3].toFixed(2) + '</td><td><span class="tag ' + (e[7] === 'unreviewed' ? 'unrev' : 'cur') + '">' + esc(e[7]) + '</span></td></tr>';
    }).join('');
    return '<div class="tablewrap"><table><thead><tr><th>' + (dir === 'out' ? 'Acts on' : 'Acted on by') + '</th><th>Effect</th><th class="num">Weight</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      (list.length > 12 ? '<p class="note">' + (list.length - 12) + ' more links not shown.</p>' : '');
  }
  function pickPaths(a, n) {
    var dominant = a.score < 0 ? -1 : 1, seen = new Set(), res = [];
    var ranked = a.paths.filter(function (p) { return pathSign(p) === dominant; }).sort(function (x, y) { return x.length - y.length || pathWeight(y) - pathWeight(x); });
    ranked.forEach(function (p) { var key = E[p[0]][1] + '>' + E[p[p.length - 1]][1]; if (res.length < n && !seen.has(key)) { seen.add(key); res.push(p); } });
    return res;
  }
  function mediatorTable(a) {
    var m = new Map();
    a.paths.forEach(function (p) { if (p.length > 1) { var t = E[p[0]][1], r = m.get(t) || { s: 0, n: 0, papers: new Set() }; r.s += pathSign(p) * pathWeight(p); r.n++; p.forEach(function (k) { if (E[k][5].indexOf('PMID') === 0) r.papers.add(E[k][5]); }); m.set(t, r); } });
    var rows = Array.from(m.entries()).sort(function (x, y) { return Math.abs(y[1].s) - Math.abs(x[1].s) || x[0] - y[0]; }).slice(0, 8);
    if (!rows.length) return '';
    return '<div class="card"><h3>First steps that carry the effect</h3><div class="tablewrap"><table><thead><tr><th>Mediator</th><th class="num">Net</th><th class="num">Paths</th><th class="num">Papers</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + nodeLink(r[0]) + '</td><td class="num" style="color:var(' + (r[1].s < 0 ? '--lowers' : '--raises') + ')">' + f1(r[1].s) + '</td><td class="num">' + r[1].n + '</td><td class="num">' + r[1].papers.size + '</td></tr>'; }).join('') +
      '</tbody></table></div></div>';
  }
  function showNode(i, push) {
    state.sel = i;
    var a = analyze(i), n = N[i], tags = '<span class="tag ' + (n[3] ? 'cur' : '') + '">' + (n[3] ? 'curated node' : 'crawled node') + '</span><span class="tag">' + esc(n[2] || 'unknown type') + '</span>' +
      role(i).map(function (r) { return '<span class="tag">' + esc(r) + '</span>'; }).join('');
    var h = '<div class="card"><div class="section-title"><h2>' + esc(n[1]) + '</h2><div class="tags">' + tags + '</div></div>';
    if (core.has(i) || isPain(i)) {
      h += '<p class="note">This is a pain outcome, so the question here is what drives it. See what acts on it below, or search a drug or target to see its effect on pain.</p></div>';
      h += '<div class="grid2"><div class="card"><h3>Acted on by</h3>' + neighbours(i, 'in') + '</div><div class="card"><h3>Acts on</h3>' + neighbours(i, 'out') + '</div></div>';
      $('#detail').innerHTML = h; return;
    }
    if (!a.paths.length) {
      h += '<p class="empty">No signed path reaches the core pain nodes within ' + (a.drug ? F.meta.max_len : F.meta.target_len) + ' links, so the graph cannot say what this does to pain.</p></div>';
      h += '<div class="grid2"><div class="card"><h3>Acted on by</h3>' + neighbours(i, 'in') + '</div><div class="card"><h3>Acts on</h3>' + neighbours(i, 'out') + '</div></div>';
      $('#detail').innerHTML = h; return;
    }
    var strong = Math.abs(a.score) >= 1, dirn = a.score < 0 ? 'lowers' : 'raises', verb, what = a.drug ? 'Predicted to ' : (a.score > 0 ? 'Drives pain' : 'Suppresses pain');
    verb = !strong ? 'No clear effect on pain from the graph.' : a.drug ? what + (a.score < 0 ? 'lower' : 'raise') + ' pain.' : what + '.';
    var allEdges = a.paths.reduce(function (acc, p) { return acc.concat(p); }, []), uniq = Array.from(new Set(allEdges));
    var curN = uniq.filter(function (k) { return E[k][4] === 1; }).length, papers = new Set(uniq.filter(function (k) { return E[k][5].indexOf('PMID') === 0; }).map(function (k) { return E[k][5]; }));
    var directTxt = a.direct.length ? 'The graph also holds a direct link to a pain node (' + a.direct.map(function (s) { return s < 0 ? 'lowers' : 'raises'; }).join(' and ') + ').' : 'No direct link to a pain node in the graph.';
    var disagree = a.direct.length === 1 && ((a.direct[0] < 0 && a.score >= 0.5) || (a.direct[0] > 0 && a.score <= -0.5));
    h += '<div class="verdict"><div class="line ' + (strong ? dirn : '') + '">' + esc(verb) + '</div><div class="stats">' +
      '<div class="stat"><b style="color:var(' + (a.score < 0 ? '--lowers' : '--raises') + ')">' + f1(a.score) + '</b><span>score (each pain node counts at most 1)</span></div>' +
      '<div class="stat"><b>' + a.neg + ' / ' + a.pos + '</b><span>core pain nodes lowered / raised</span></div>' +
      '<div class="stat"><b>' + a.mediators + '</b><span>independent first steps</span></div>' +
      '<div class="stat"><b>' + pct(Math.round(a.agreement * 100), 100) + '</b><span>of reached nodes agree</span></div></div>' +
      '<p class="note">' + esc(directTxt) + ' Across all ' + a.paths.length + ' paths, ' + curN + ' of ' + uniq.length + ' distinct links are curated; the rest come from ' + papers.size + ' unreviewed paper' + (papers.size === 1 ? '' : 's') + '.</p>' +
      (disagree ? '<p class="note" style="color:var(--warn)"><b>Double-edged:</b> the direct link says one thing and the other paths say the opposite. That usually means a context-dependent effect or an off-target liability.</p>' : '') + '</div></div>';
    h += '<div class="card"><h3>Effect on each core pain node</h3>' + chartOutcomes(a) + '<p class="note">Bars show tanh of the summed signed path weights, so a node reached by many agreeing paths saturates at ±1. Core nodes are the ' + F.meta.core.length + ' pain nodes with the most evidence.</p></div>';
    h += mediatorTable(a);
    var top = pickPaths(a, 6);
    h += '<div class="section-title"><h3>Strongest paths in the direction of the verdict</h3><p class="note">Shortest and heaviest first, one per first step and pain node. Open a path for the quote behind each link.</p></div>' + top.map(function (p, j) { return pathCard(p, j === 0); }).join('');
    h += '<div class="grid2"><div class="card"><h3>Acted on by</h3>' + neighbours(i, 'in') + '</div><div class="card"><h3>Acts on</h3>' + neighbours(i, 'out') + '</div></div>';
    $('#detail').innerHTML = h;
  }

  /* ---------- search ---------- */
  var state = { sel: null, tab: 'explore', active: -1, hits: [] };
  function norm(s) { return s.toLowerCase().replace(/[^a-z0-9α-ω]/g, ''); }
  function search(q) {
    var nq = norm(q); if (!nq) return [];
    var hits = [];
    for (var i = 0; i < N.length; i++) { var l = N[i].nl; var p = l.indexOf(nq); if (p >= 0) hits.push({ i: i, rank: (p === 0 ? 0 : 1) * 1e6 - deg[i] + l.length / 100 }); }
    return hits.sort(function (a, b) { return a.rank - b.rank; }).slice(0, 12).map(function (h) { return h.i; });
  }
  function renderResults() {
    var ul = $('#results'); ul.hidden = !state.hits.length; $('#q').setAttribute('aria-expanded', String(!ul.hidden));
    ul.innerHTML = state.hits.map(function (i, j) { return '<li role="option" id="opt' + j + '" data-i="' + i + '" aria-selected="' + (j === state.active) + '"><span>' + esc(N[i][1]) + '</span><span class="tag">' + esc(role(i)[0] || N[i][2] || 'node') + '</span></li>'; }).join('');
  }
  function choose(i) { $('#q').value = N[i][1]; state.hits = []; state.active = -1; renderResults(); if (state.tab !== 'explore') setTab('explore'); showNode(i); }
  function wireSearch() {
    var q = $('#q');
    q.addEventListener('input', function () { state.hits = search(q.value); state.active = -1; renderResults(); });
    q.addEventListener('keydown', function (ev) {
      if (ev.key === 'ArrowDown' && state.hits.length) { ev.preventDefault(); state.active = (state.active + 1) % state.hits.length; renderResults(); }
      else if (ev.key === 'ArrowUp' && state.hits.length) { ev.preventDefault(); state.active = (state.active - 1 + state.hits.length) % state.hits.length; renderResults(); }
      else if (ev.key === 'Enter' && state.hits.length) { ev.preventDefault(); choose(state.hits[Math.max(state.active, 0)]); }
      else if (ev.key === 'Escape') { state.hits = []; renderResults(); }
    });
    $('#results').addEventListener('mousedown', function (ev) { var li = ev.target.closest('li'); if (li) { ev.preventDefault(); choose(+li.dataset.i); } });
    document.addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-node]'); if (b) { choose(+b.dataset.node); window.scrollTo({ top: 0 }); return; }
      if (!ev.target.closest('.search')) { state.hits = []; renderResults(); }
    });
    var ex = ['morphine', 'simvastatin', 'capsaicin', 'TNF', 'NLRP3', 'TLR4', 'electroacupuncture', 'PPAR-gamma'], box = $('#examples');
    ex.forEach(function (name) { var hit = search(name)[0]; if (hit !== undefined) { var b = document.createElement('button'); b.className = 'chip'; b.textContent = name; b.addEventListener('click', function () { choose(hit); }); box.appendChild(b); } });
  }

  /* ---------- findings ---------- */
  function drugTable(rows, withPath) {
    if (!rows.length) return '<p class="note">None.</p>';
    return '<div class="tablewrap"><table><thead><tr><th>Drug</th><th class="num">Score</th><th class="num">Pain nodes −/+</th><th class="num">Steps</th><th>Direct</th>' + (withPath ? '<th>Strongest path</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + nodeLink(r.node) + '</td><td class="num" style="color:var(' + (r.score < 0 ? '--lowers' : '--raises') + ')">' + f1(r.score) + '</td><td class="num">' + r.neg + '/' + r.pos + '</td><td class="num">' + r.mediators + '</td><td>' +
        (r.direct.length ? esc(r.direct.map(function (s) { return s < 0 ? 'lowers' : 'raises'; }).join(', ')) : '<span class="muted">none</span>') + '</td>' +
        (withPath ? '<td><div class="chain">' + (r.path.length ? chain(r.path) : '') + '</div></td>' : '') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function targetTable(rows) {
    return '<div class="tablewrap"><table><thead><tr><th>Node</th><th class="num">Score</th><th class="num">Pain nodes driven</th><th class="num">Drugs inhibiting</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + nodeLink(r.node) + '</td><td class="num">' + f1(r.score) + '</td><td class="num">' + r.drives + '</td><td class="num">' + r.inhibitors + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function chokeChart(rows) {
    var labelW = 210, plotW = 420, rowH = 26, top = 8, W = labelW + plotW + 60, max = 0.6, H = top + rows.length * rowH + 22;
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Share of pain-promoting flow through each node">';
    [0, 0.2, 0.4, 0.6].forEach(function (t) { var x = labelW + t / max * plotW; svg += '<line class="ax" x1="' + x + '" x2="' + x + '" y1="' + top + '" y2="' + (H - 18) + '"/><text class="tm" x="' + x + '" y="' + (H - 4) + '" text-anchor="middle">' + Math.round(t * 100) + '%</text>'; });
    rows.forEach(function (r, j) { var y = top + j * rowH, w = Math.min(r.share, max) / max * plotW, lab = short(N[r.node][1]); if (lab.length > 30) lab = lab.slice(0, 29) + '…';
      svg += '<text class="t" x="' + (labelW - 8) + '" y="' + (y + 16) + '" text-anchor="end">' + esc(lab) + '</text><rect class="barA" x="' + labelW + '" y="' + (y + 4) + '" width="' + w + '" height="' + (rowH - 10) + '" rx="2"/><text class="tm" x="' + (labelW + w + 6) + '" y="' + (y + 16) + '">' + Math.round(r.share * 100) + '%</text>'; });
    return '<div class="chartwrap">' + svg + '</svg></div>';
  }
  function loopLine(l) { return '<div class="loopline">' + l.nodes.map(function (n, j) { return nodeBtn(n) + '<span class="arrow raises">→</span>'; }).join('') + nodeBtn(l.nodes[0]) + '<span class="muted mono" style="font-size:12px">weight ' + l.weight.toFixed(2) + (l.inhibitory ? ', ' + l.inhibitory + ' inhibitory' : '') + '</span></div>'; }
  function renderFindings() {
    var c = F.calibration, m = F.meta, a = c.two_hop.all, h = '';
    h += '<div class="big3"><div class="card"><h3>Signs compose</h3><b class="n">' + pct(a[0], a[1]) + '</b><p class="note">A direct link’s sign is predicted correctly from its two-hop paths, ' + a[0].toLocaleString() + ' of ' + a[1].toLocaleString() + ' times. With three or more agreeing paths: ' + pct(c.by_support['3'][0], c.by_support['3'][1]) + '.</p></div>' +
      '<div class="card"><h3>Drug ranking is weak</h3><b class="n">' + c.auc.toFixed(2) + '</b><p class="note">AUC for telling known analgesics from other drugs (0.5 is chance). A drug in a pain paper is mostly studied as an analgesic, so the graph leans that way.</p></div>' +
      '<div class="card"><h3>Drugs called pain-raising</h3><b class="n">' + F.pain_raising.length + '</b><p class="note">Reading the list by hand, most are established inducers or genuine off-target liabilities, and a few look wrong. Table below.</p></div></div>';
    h += '<div class="card"><div class="section-title"><h2>Drugs predicted to raise pain</h2><p class="note">Score of +1 or more, at least two independent first steps, at least 80% of reached pain nodes agree. The rare opposite call is the most informative check of the method: chemotherapies, nitroglycerin, capsaicin, BzATP and CFA appear, and so do opioid-induced hyperalgesia (morphine, fentanyl) and channel-activating off-target effects (simvastatin and TRPV1, amitriptyline and TRPA1, clotrimazole and TRPV1).</p></div>' + drugTable(F.pain_raising.slice(0, 15), true) + '</div>';
    h += '<div class="card"><div class="section-title"><h2>Double-edged drugs</h2><p class="note">The direct link says one thing, the other paths the opposite: a context-dependent effect, or an off-target liability.</p></div>' + drugTable(F.double_edged, true) + '</div>';
    h += '<div class="grid2"><div class="card"><div class="section-title"><h2>What drives pain</h2><p class="note">Targets by summed effect on the core pain nodes.</p></div>' + targetTable(F.drivers) + '</div>' +
      '<div class="card"><div class="section-title"><h2>Chokepoints</h2><p class="note">Share of the weighted pain-promoting flow from ' + F.chokepoints.sources + ' nerve-injury models (' + F.chokepoints.paths.toLocaleString() + ' paths) that passes through each node. Partly a measure of how much each node is studied.</p></div>' + chokeChart(F.chokepoints.ranked) + '</div></div>';
    h += '<div class="grid2"><div class="card"><div class="section-title"><h2>Targets with no inhibiting drug in the graph</h2><p class="note">' + F.n_gaps + ' in total. These are gaps in the graph, not in biology: NGF has anti-NGF antibodies that are simply not in it.</p></div>' + targetTable(F.gaps) + '</div>' +
      '<div class="card"><div class="section-title"><h2>Inducers and suppressors</h2></div><h3>Inducers (nothing in the graph acts on them)</h3><div class="tags">' + F.inducers.map(function (r) { return nodeBtn(r.node); }).join('') + '</div><h3>Raising these lowers pain</h3><div class="tags">' + F.suppressors.map(function (r) { return nodeBtn(r.node); }).join('') + '</div></div></div>';
    h += '<div class="card"><div class="section-title"><h2>Self-reinforcing loops</h2><p class="note">An even number of inhibitory links makes a loop amplify itself. ' + F.loops.n_pos_pairs + ' of ' + F.loops.n_pairs + ' two-node loops reinforce each other; ' + F.loops.n_pos_longer.toLocaleString() + ' of ' + F.loops.n_longer.toLocaleString() + ' longer loops are self-amplifying.</p></div><h3>Mutually reinforcing pairs</h3>' + F.loops.pairs.map(loopLine).join('') + '<h3>Strongest longer loops</h3>' + F.loops.longer.map(loopLine).join('') +
      '<h3>In the most amplifying loops</h3><div class="tags">' + F.loops.hubs.map(function (r) { return nodeBtn(r.node) + '<span class="mono muted" style="font-size:12px">' + r.count + '</span>'; }).join('') + '</div></div>';
    h += '<div class="card"><div class="section-title"><h2>Novel analgesic candidates</h2><p class="note">' + F.n_candidates + ' drugs with a net analgesic score, two or more independent first steps, 80% agreement and no direct pain link. Read this as a literature-weighted ranking, not a prediction (AUC ' + c.auc.toFixed(2) + ').</p></div>' + drugTable(F.candidates, true) + '</div>';
    $('#panel-findings').innerHTML = h;
  }
  function renderGuide() {
    var c = F.calibration, m = F.meta;
    $('#panel-guide').innerHTML = '<div class="card"><h2>How a result is computed</h2><ul class="plain">' +
      '<li>Every signed link reads “A raises B” (+) or “A lowers B” (−). A path’s sign is the product of its link signs, so a drug that lowers a mediator that raises pain lowers pain.</li>' +
      '<li>A path’s weight is the product of its link weights, scaled by ' + m.decay + ' for each extra link. Curated links weigh 0.6 to 0.95 by review status. Crawled links weigh more when more papers support them and less when the quote is hedged.</li>' +
      '<li>For each of the ' + m.core.length + ' best-evidenced pain nodes the summed signed path weight is squashed with tanh, so a hub that fans out to many pain nodes cannot inflate a score. The score is the sum over those nodes.</li>' +
      '<li>Drugs use paths of up to ' + m.max_len + ' links, other nodes up to ' + m.target_len + '. Drugs are never intermediate steps.</li></ul></div>' +
      '<div class="card"><h2>What the graph holds</h2><p>' + m.links.toLocaleString() + ' signed links over ' + m.nodes.toLocaleString() + ' nodes: ' + m.curated.toLocaleString() + ' curated and ' + m.crawled.toLocaleString() + ' crawled from papers and not yet reviewed. Left out: ' +
      Object.keys(m.excluded).map(function (k) { return m.excluded[k] + ' ' + k.replace(/_/g, ' '); }).join(', ') + '. Unsigned links (binds, interacts with) carry no direction and are not used.</p></div>' +
      '<div class="card"><h2>How far to trust it</h2><ul class="plain">' +
      '<li><b>Sign composition works.</b> Two-hop paths reproduce a direct link’s sign ' + pct(c.two_hop.all[0], c.two_hop.all[1]) + ' of the time (' + pct(c.two_hop.curated[0], c.two_hop.curated[1]) + ' for curated links alone, ' + c.two_hop.curated[1] + ' cases).</li>' +
      '<li><b>Ranking drugs as analgesics is weak.</b> AUC ' + c.auc.toFixed(2) + ', and the method calls ' + Math.round(c.base_rate * 100) + '% of all drugs analgesic. The crawl is biased toward drugs studied as analgesics.</li>' +
      '<li><b>Opposite calls are informative.</b> The ' + F.pain_raising.length + ' drugs predicted to raise pain are mostly known inducers or off-target liabilities.</li>' +
      '<li><b>Hubs dominate.</b> TNF-α, TRPV1, NLRP3 and CGRP sit on most paths partly because they are studied most.</li>' +
      '<li><b>Errors exist.</b> A review of 504 links between curated nodes found 77% fully supported by their quote, 18% overstated, weak or context-limited, and 4.6% wrong. One example: a quote reading “patients with severe pain had <i>lower</i> TNFα” was coded as TNF lowering pain.</li></ul></div>' +
      '<div class="card"><h2>Duplicate nodes</h2><p class="note">' + F.duplicates.length + ' or more crawled nodes name the same entity as a curated node under another spelling, so their links never reach it. This view shows the graph as it is.</p></div>';
  }

  /* ---------- tabs, boot ---------- */
  function setTab(t) {
    state.tab = t;
    ['explore', 'findings', 'guide'].forEach(function (k) { var on = k === t; $('#tab-' + k).setAttribute('aria-selected', String(on)); $('#panel-' + k).hidden = !on; });
    if (location.hash.slice(1) !== t) { try { history.replaceState(null, '', '#' + t); } catch (e) { location.hash = t; } }
  }
  function boot(data) {
    N = data[0]; E = data[1]; F = data[2];
    N.forEach(function (n) { n.nl = norm(n[1]); });
    buildIndex();
    $('#subtitle').textContent = F.meta.links.toLocaleString() + ' signed links between ' + F.meta.nodes.toLocaleString() + ' nodes, ' + F.meta.curated + ' curated and ' + F.meta.crawled.toLocaleString() + ' from crawled papers. Search any node to see what the graph says it does to pain, and why.';
    $('#q').disabled = false;
    wireSearch(); renderFindings(); renderGuide();
    document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.dataset.tab); }); });
    var start = (location.hash.slice(1) || 'explore'); if (['explore', 'findings', 'guide'].indexOf(start) < 0) start = 'explore';
    setTab(start);
    var first = search('morphine')[0]; if (first !== undefined) { $('#q').value = N[first][1]; showNode(first); }
    window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (['explore', 'findings', 'guide'].indexOf(h) >= 0 && h !== state.tab) setTab(h); });
  }
  var ready = Promise.all(['nodes.json', 'edges.json', 'findings.json'].map(function (f) { return fetch(f).then(function (r) { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); }); }))
    .then(function (d) { boot(d); return true; })
    .catch(function (err) { $('#subtitle').textContent = 'The graph data did not load (' + err.message + '). Reload the page.'; return false; });
  window.Explorer = { ready: ready, analyze: function (i) { var a = analyze(i); return { score: a.score, neg: a.neg, pos: a.pos, mediators: a.mediators, n_paths: a.paths.length, direct: a.direct, agreement: a.agreement }; },
    index: function (id) { return N.findIndex(function (n) { return n[0] === id; }); } };
})();
</script>
