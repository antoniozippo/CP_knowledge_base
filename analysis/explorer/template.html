<title>Pain Graph Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* One working column. A row of tabs leads, one row of settings (pain type, evidence, plain language) sits
   under it, and each tab answers a different question for a different reader.
   Palette: cool slate ground, cobalt for what you can press, two signal hues that mean one thing
   everywhere: rust = raises pain, teal = lowers pain. */
:root {
  --bg: #f3f6f7; --surface: #ffffff; --surface-2: #e9eff1; --ink: #132029; --muted: #566772; --line: #d3dce1;
  --accent: #2250b8; --accent-soft: #e1e9fb;
  --lowers: #13707f; --lowers-soft: #d9eff2; --raises: #a83d27; --raises-soft: #f7e2dc;
  --warn: #7a5d00; --warn-soft: #f5ecc9;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1418; --surface: #141d23; --surface-2: #1b2830; --ink: #e5edf1; --muted: #93a5b0; --line: #2a3a44;
  --accent: #86a9ff; --accent-soft: #1a2845;
  --lowers: #5cc2d2; --lowers-soft: #11323a; --raises: #f19079; --raises-soft: #3a1f19;
  --warn: #e4c65c; --warn-soft: #33300f; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1418; --surface: #141d23; --surface-2: #1b2830; --ink: #e5edf1; --muted: #93a5b0; --line: #2a3a44;
  --accent: #86a9ff; --accent-soft: #1a2845;
  --lowers: #5cc2d2; --lowers-soft: #11323a; --raises: #f19079; --raises-soft: #3a1f19;
  --warn: #e4c65c; --warn-soft: #33300f; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-ui); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 56px; }
.wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.wrap > * { min-width: 0; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 21px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
p { margin: 0; max-width: 68ch; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
header { display: grid; gap: 6px; }
header p { color: var(--muted); }
.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 14px; max-width: none; }
.banner b { color: var(--warn); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: thin; }
.tabs button { flex: none; white-space: nowrap; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px; cursor: pointer; font-weight: 500; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:hover { color: var(--ink); }
.panel { display: grid; gap: 18px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; grid-template-columns: minmax(0, 1fr); }
.grid2 { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
/* settings bar */
.settings { display: flex; gap: 10px 22px; flex-wrap: wrap; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.set { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); min-width: 0; }
.set select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--ink); max-width: 100%; min-width: 0; flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--surface); border: 0; border-right: 1px solid var(--line); padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
/* pickers */
.picker { position: relative; }
.picker input, .fld { width: 100%; font: inherit; padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.picker input::placeholder, .fld::placeholder { color: var(--muted); }
.results { position: absolute; top: 48px; left: 0; right: 0; z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: 360px; overflow-y: auto; list-style: none; margin: 0; padding: 4px; }
.results li { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
.results li[aria-selected="true"], .results li:hover { background: var(--accent-soft); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 600; }
.btn.primary:hover { color: var(--surface); filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; min-width: 0; }
.field { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
/* badges */
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: 500 11px/1 var(--font-data); letter-spacing: 0.03em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.cur { background: var(--accent-soft); color: var(--accent); }
.tag.unrev { background: var(--warn-soft); color: var(--warn); }
.tag.lowers { background: var(--lowers-soft); color: var(--lowers); }
.tag.raises { background: var(--raises-soft); color: var(--raises); }
/* verdict */
.verdict { display: grid; gap: 14px; }
.verdict .line { font-size: 19px; font-weight: 500; line-height: 1.35; max-width: 60ch; }
.verdict .line.lowers { color: var(--lowers); } .verdict .line.raises { color: var(--raises); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat { display: grid; gap: 2px; border-left: 2px solid var(--line); padding-left: 10px; }
.stat b { font: 500 22px/1.1 var(--font-data); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.plainbox { background: var(--surface-2); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; font-size: 16px; max-width: 70ch; }
/* charts */
.chartwrap { overflow-x: auto; }
svg.chart { display: block; width: 100%; min-width: 520px; max-width: 760px; height: auto; }
svg .t { fill: var(--ink); font: 12px var(--font-ui); } svg .tm { fill: var(--muted); font: 11px var(--font-data); }
svg .ax { stroke: var(--line); stroke-width: 1; } svg .zero { stroke: var(--muted); stroke-width: 1; }
svg .barL { fill: var(--lowers); } svg .barR { fill: var(--raises); } svg .barA { fill: var(--accent); } svg .barC { fill: var(--muted); }
/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 600 11px/1.2 var(--font-ui); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th button { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; cursor: pointer; }
th button:hover, th button[aria-pressed="true"] { color: var(--accent); }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
th.num { text-align: right; }
tr.dim td { opacity: .45; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.link:hover { text-decoration-color: currentColor; }
/* paths */
.path { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); display: grid; }
.path > header { padding: 12px 14px; display: grid; gap: 8px; }
.pathhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.chain { display: flex; gap: 6px 4px; align-items: center; flex-wrap: wrap; }
.node { background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 14px; max-width: 100%; text-align: left; }
.node:hover { border-color: var(--accent); }
.node.end { background: var(--accent-soft); }
.arrow { font: 500 12px var(--font-data); white-space: nowrap; display: inline-flex; gap: 4px; align-items: center; }
.arrow.raises { color: var(--raises); } .arrow.lowers { color: var(--lowers); }
.path details { border-top: 1px solid var(--line); }
.path summary { cursor: pointer; padding: 8px 14px; font-size: 13px; color: var(--muted); }
.path summary:hover { color: var(--ink); }
.evs { list-style: none; margin: 0; padding: 0 14px 12px; display: grid; gap: 12px; }
.ev { display: grid; gap: 4px; padding-left: 12px; border-left: 3px solid var(--line); }
.ev.raises { border-left-color: var(--raises); } .ev.lowers { border-left-color: var(--lowers); }
.ev-top { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.ev blockquote { margin: 0; font-size: 13px; color: var(--muted); max-width: 80ch; }
.ev .src { font: 12px var(--font-data); color: var(--muted); }
.meter { display: inline-block; width: 44px; height: 6px; border-radius: 3px; background: var(--surface-2); vertical-align: middle; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--muted); }
/* start */
.hero { display: grid; gap: 8px; }
.hero h2 { font-size: 24px; }
.roles { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.role { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: grid; gap: 8px; align-content: start; text-align: left; cursor: pointer; }
.role:hover { border-color: var(--accent); }
.role b { font-size: 16px; } .role span { font-size: 13px; color: var(--muted); } .role em { font-style: normal; font-size: 13px; color: var(--accent); }
.glance { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
/* pain types */
.pgrid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 6px; text-align: left; cursor: pointer; align-content: start; }
.pcard:hover { border-color: var(--accent); }
.pcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.pcard b { font-size: 15px; } .pcard .small { font-size: 12px; color: var(--muted); }
.covbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--surface-2); }
.covbar i { display: block; height: 100%; } .covbar .a { background: var(--accent); } .covbar .b { background: var(--muted); opacity: .55; }
/* compare */
.matrix td, .matrix th { padding: 6px 8px 6px 0; }
.matrix th:not(:first-child), .matrix td.num { text-align: center; }
.cell { text-align: center; border-radius: 4px; font: 12px var(--font-data); padding: 5px 4px; min-width: 52px; }
/* review */
.votes { display: flex; gap: 6px; flex-wrap: wrap; }
.vbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.vbtn:hover { border-color: var(--accent); }
.vbtn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.vbtn[aria-pressed="true"].bad { background: var(--raises-soft); border-color: var(--raises); color: var(--raises); }
.vbtn:disabled { opacity: .5; cursor: default; }
.rv { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.rv blockquote { margin: 0; padding-left: 12px; border-left: 3px solid var(--line); font-size: 14px; max-width: 80ch; }
.rv .note-in { max-width: 420px; padding: 6px 10px; font-size: 13px; }
/* misc */
.note { font-size: 13px; color: var(--muted); max-width: 80ch; }
.section-title { display: grid; gap: 4px; }
.empty { color: var(--muted); padding: 24px 0; }
.big3 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.big3 .card b.n { font: 500 34px/1 var(--font-data); font-variant-numeric: tabular-nums; }
ul.plain { margin: 0; padding-left: 18px; display: grid; gap: 6px; max-width: 76ch; }
dl.gloss { margin: 0; display: grid; gap: 10px; max-width: 76ch; } dl.gloss dt { font-weight: 600; } dl.gloss dd { margin: 0; color: var(--muted); }
.loopline { display: flex; gap: 4px 6px; flex-wrap: wrap; align-items: center; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .results, .path { animation: rise .14s ease-out; } @keyframes rise { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } } }
</style>

<div class="wrap">
  <header>
    <h1>Pain Graph Explorer</h1>
    <p id="subtitle">Loading the graph…</p>
  </header>
  <p class="banner"><b>A research map, not medical advice.</b> Most links come from papers read by software and not yet checked by a person. Read every result as a hypothesis, and open a path to see the quote behind each link.</p>
  <nav class="tabs" role="tablist" aria-label="Views">
    <button role="tab" id="tab-start" aria-selected="true" aria-controls="panel-start" data-tab="start">Start</button>
    <button role="tab" id="tab-explore" aria-selected="false" aria-controls="panel-explore" data-tab="explore">Explore</button>
    <button role="tab" id="tab-connect" aria-selected="false" aria-controls="panel-connect" data-tab="connect">Connect &amp; compare</button>
    <button role="tab" id="tab-rank" aria-selected="false" aria-controls="panel-rank" data-tab="rank">Rank</button>
    <button role="tab" id="tab-types" aria-selected="false" aria-controls="panel-types" data-tab="types">Pain types</button>
    <button role="tab" id="tab-review" aria-selected="false" aria-controls="panel-review" data-tab="review">Review</button>
    <button role="tab" id="tab-landscape" aria-selected="false" aria-controls="panel-landscape" data-tab="landscape">Landscape</button>
    <button role="tab" id="tab-findings" aria-selected="false" aria-controls="panel-findings" data-tab="findings">Findings</button>
    <button role="tab" id="tab-guide" aria-selected="false" aria-controls="panel-guide" data-tab="guide">Guide</button>
  </nav>
  <div class="settings" id="settings" hidden>
    <label class="set" id="set-fam">Pain type <select id="fam" aria-label="Pain type"></select></label>
    <div class="set" id="set-ev" role="group" aria-label="Evidence to use"><span>Evidence</span>
      <span class="seg">
        <button data-ev="all" aria-pressed="true" title="Every signed link in the graph">All</button>
        <button data-ev="corroborated" aria-pressed="false" title="Curated links, plus crawled links backed by two or more papers and not hedged">Corroborated</button>
        <button data-ev="curated" aria-pressed="false" title="Only links an expert curated. These reach very few drugs.">Curated only</button>
      </span></div>
    <label class="set check" id="set-plain"><input type="checkbox" id="plain"> Plain language</label>
  </div>

  <section class="panel" id="panel-start" role="tabpanel" aria-labelledby="tab-start"></section>
  <section class="panel" id="panel-explore" role="tabpanel" aria-labelledby="tab-explore" hidden>
    <div class="row" style="flex-wrap:nowrap"><div id="exp-picker" style="flex:1;min-width:0"></div><button class="btn" id="share" title="Copy a link to this view">Copy link</button></div>
    <div class="chips" id="examples"><span class="muted" style="font-size:13px">Try</span></div>
    <div id="detail"></div>
  </section>
  <section class="panel" id="panel-connect" role="tabpanel" aria-labelledby="tab-connect" hidden></section>
  <section class="panel" id="panel-rank" role="tabpanel" aria-labelledby="tab-rank" hidden></section>
  <section class="panel" id="panel-types" role="tabpanel" aria-labelledby="tab-types" hidden></section>
  <section class="panel" id="panel-review" role="tabpanel" aria-labelledby="tab-review" hidden></section>
  <section class="panel" id="panel-landscape" role="tabpanel" aria-labelledby="tab-landscape" hidden></section>
  <section class="panel" id="panel-findings" role="tabpanel" aria-labelledby="tab-findings" hidden></section>
  <section class="panel" id="panel-guide" role="tabpanel" aria-labelledby="tab-guide" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script>

    return '<div class="chartwrap">' + svg + '</svg></div>';
  }
  function renderLandscape() {
    var m = F.meta, depth = { 1: 0, 2: 0, 3: 0 }, status = {}, types = {};
    for (var k = 0; k < NS; k++) { var e = E[k]; if (e[4] === 0) depth[Math.min(3, 1 + e[8])]++; status[e[7]] = (status[e[7]] || 0) + 1; }
    N.forEach(function (n) { types[n[2] || 'unknown'] = (types[n[2] || 'unknown'] || 0) + 1; });
    var fams = FAM.families.filter(function (f) { return f.key !== 'any'; }).slice().sort(function (a, b) { return b.stats.links_in - a.stats.links_in; });
    var maxIn = fams[0].stats.links_in;
    var h = '<div class="section-title"><h2>Where the evidence is, and where it is thin</h2><p class="note">For anyone deciding what to read, check or fund next.</p></div>';
    h += '<div class="big3"><div class="card"><h3>Single-paper links</h3><b class="n">' + pct(depth[1], m.crawled) + '</b><p class="note">of crawled links rest on one paper. ' + depth[2].toLocaleString() + ' have two and ' + depth[3].toLocaleString() + ' have three or more. Switching Evidence to Corroborated drops the single-paper links.</p></div>' +
      '<div class="card"><h3>Not yet checked</h3><b class="n">' + pct(m.crawled, m.links) + '</b><p class="note">of signed links come from papers read by software. ' + m.curated.toLocaleString() + ' were curated, and ' + (status.confirmed || 0) + ' of those confirmed against the literature.</p></div>' +
      '<div class="card"><h3>Reached by curated links alone</h3><b class="n">' + m.curated_only_drugs + '</b><p class="note">drugs have a route to pain using curated links only. The graph’s reach on drugs rests on crawled evidence.</p></div></div>';
    h += '<div class="card"><div class="section-title"><h3>Links into each pain type</h3><p class="note">Links whose target is a pain node of that type. A short bar means a type the graph cannot yet speak about.</p></div>' + barRows(fams.map(function (f) { return { label: famName(f.key), v: f.stats.links_in }; }), maxIn) + '</div>';
    h += '<div class="card"><div class="section-title"><h3>Pain types compared</h3></div><div class="tablewrap"><table><thead><tr><th>Type</th><th class="num">Links in</th><th class="num">Curated</th><th class="num">Papers</th><th class="num">Drivers</th><th class="num">Drugs lower</th><th class="num">Gaps</th><th>Coverage</th></tr></thead><tbody>' +
      fams.map(function (f) { var c = covLabel(f), s = f.stats; return '<tr><td><button class="link" data-typego="' + f.key + '">' + esc(famName(f.key)) + '</button></td><td class="num">' + s.links_in + '</td><td class="num">' + s.curated_in + '</td><td class="num">' + s.papers + '</td><td class="num">' + s.drivers + '</td><td class="num">' + s.drugs_lower + '</td><td class="num">' + s.gaps + '</td><td><span class="tag ' + c[1] + '">' + c[0] + '</span></td></tr>'; }).join('') + '</tbody></table></div></div>';
    var tyRows = Object.keys(types).map(function (t) { return { label: t, v: types[t] }; }).sort(function (a, b) { return b.v - a.v; }).slice(0, 12);
    h += '<div class="grid2"><div class="card"><div class="section-title"><h3>What the nodes are</h3></div>' + barRows(tyRows, tyRows[0].v, 'barC') + '</div>' +
      '<div class="card"><div class="section-title"><h3>Links by review status</h3></div>' + barRows(Object.keys(status).map(function (s) { return { label: s.replace(/_/g, ' '), v: status[s] }; }).sort(function (a, b) { return b.v - a.v; }), status.unreviewed, 'barC') + '</div></div>';
    $('#panel-landscape').innerHTML = h;
  }

  /* ---------- findings ---------- */
  function drugTable(rows, withPath) {
    if (!rows.length) return '<p class="note">None.</p>';
    return '<div class="tablewrap"><table><thead><tr><th>Drug</th><th class="num">Score</th><th class="num">Pain nodes −/+</th><th class="num">Steps</th><th>Direct</th>' + (withPath ? '<th>Strongest path</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + nodeLink(r.node) + '</td><td class="num" style="color:var(' + (r.score < 0 ? '--lowers' : '--raises') + ')">' + f1(r.score) + '</td><td class="num">' + r.neg + '/' + r.pos + '</td><td class="num">' + r.mediators + '</td><td>' +
        (r.direct.length ? esc(r.direct.map(function (s) { return s < 0 ? 'lowers' : 'raises'; }).join(', ')) : '<span class="muted">none</span>') + '</td>' +
        (withPath ? '<td><div class="chain">' + (r.path.length ? chain(r.path) : '') + '</div></td>' : '') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function targetTable(rows) {
    return '<div class="tablewrap"><table><thead><tr><th>Node</th><th class="num">Score</th><th class="num">Pain nodes driven</th><th class="num">Drugs inhibiting</th></tr></thead><tbody>' +
      rows.map(function (r) { return '<tr><td>' + nodeLink(r.node) + '</td><td class="num">' + f1(r.score) + '</td><td class="num">' + r.drives + '</td><td class="num">' + r.inhibitors + '</td></tr>'; }).join('') + '</tbody></table></div>';
  }
  function chokeChart(rows) {
    var labelW = 210, plotW = 420, rowH = 26, top = 8, W = labelW + plotW + 60, max = 0.6, H = top + rows.length * rowH + 22;
    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Share of pain-promoting flow through each node">';
    [0, 0.2, 0.4, 0.6].forEach(function (t) { var x = labelW + t / max * plotW; svg += '<line class="ax" x1="' + x + '" x2="' + x + '" y1="' + top + '" y2="' + (H - 18) + '"/><text class="tm" x="' + x + '" y="' + (H - 4) + '" text-anchor="middle">' + Math.round(t * 100) + '%</text>'; });
    rows.forEach(function (r, j) { var y = top + j * rowH, w = Math.min(r.share, max) / max * plotW, lab = short(N[r.node][1]); if (lab.length > 30) lab = lab.slice(0, 29) + '…';
      svg += '<text class="t" x="' + (labelW - 8) + '" y="' + (y + 16) + '" text-anchor="end">' + esc(lab) + '</text><rect class="barA" x="' + labelW + '" y="' + (y + 4) + '" width="' + w + '" height="' + (rowH - 10) + '" rx="2"/><text class="tm" x="' + (labelW + w + 6) + '" y="' + (y + 16) + '">' + Math.round(r.share * 100) + '%</text>'; });
    return '<div class="chartwrap">' + svg + '</svg></div>';
  }
  function loopLine(l) { return '<div class="loopline">' + l.nodes.map(function (n) { return nodeBtn(n) + '<span class="arrow raises">→</span>'; }).join('') + nodeBtn(l.nodes[0]) + '<span class="muted mono" style="font-size:12px">weight ' + l.weight.toFixed(2) + (l.inhibitory ? ', ' + l.inhibitory + ' inhibitory' : '') + '</span></div>'; }
  function renderFindings() {
    var c = F.calibration, a = c.two_hop.all, h = '';
    var b = c.baselines, bi = b.independent_paths;
    h += '<div class="big3"><div class="card"><h3>Paths add little to signs</h3><b class="n">' + pct(bi.composition_right_when_disagree, bi.disagree) + '</b><p class="note">Two-hop paths predict a direct link’s sign ' + pct(a[0], a[1]) + ' of the time, but guessing from the source node’s usual sign alone scores ' + pct(b.all_paths.source, b.all_paths.n) + ' on the same links. Using only paths from other papers, the two disagree on ' + bi.disagree + ' links and the paths are right ' + bi.composition_right_when_disagree + ' times, close to a coin flip.</p></div>' +
      '<div class="card"><h3>Drug ranking is weak</h3><b class="n">' + c.auc.toFixed(2) + '</b><p class="note">AUC for telling known analgesics from other drugs (0.5 is chance). A drug in a pain paper is mostly studied as an analgesic, so the graph leans that way.</p></div>' +
      '<div class="card"><h3>Drugs called pain-raising</h3><b class="n">' + F.pain_raising.length + '</b><p class="note">Reading the list by hand, most are established inducers or genuine off-target liabilities, and a few look wrong. Table below.</p></div></div>';
    h += '<div class="card"><div class="section-title"><h2>Drugs predicted to raise pain</h2><p class="note">Score of +1 or more, at least two independent first steps, at least 80% of reached pain nodes agree. The rare opposite call is the most informative check of the method: chemotherapies (paclitaxel, oxaliplatin, vincristine, cisplatin), nitroglycerin, capsaicin, BzATP and CFA appear, and so do the opioids morphine and fentanyl, which fits opioid-induced hyperalgesia. A few entries look wrong or are tool compounds, so read the list as a check on the method, not as a safety finding.</p></div>' + drugTable(F.pain_raising.slice(0, 15), true) + '</div>';
    h += '<div class="card"><div class="section-title"><h2>Double-edged drugs</h2><p class="note">The direct link says one thing, the other paths the opposite: a context-dependent effect, or an off-target liability.</p></div>' + drugTable(F.double_edged, true) + '</div>';
    h += '<div class="grid2"><div class="card"><div class="section-title"><h2>What drives pain</h2><p class="note">Targets by summed effect on the core pain nodes.</p></div>' + targetTable(F.drivers) + '</div>' +
      '<div class="card"><div class="section-title"><h2>Chokepoints</h2><p class="note">Share of the weighted pain-promoting flow from ' + F.chokepoints.sources + ' nerve-injury models (' + F.chokepoints.paths.toLocaleString() + ' paths) that passes through each node. Partly a measure of how much each node is studied.</p></div>' + chokeChart(F.chokepoints.ranked) + '</div></div>';
    h += '<div class="grid2"><div class="card"><div class="section-title"><h2>Targets with no inhibiting drug in the graph</h2><p class="note">' + F.n_gaps + ' in total. These are gaps in the graph, not in biology: NGF has anti-NGF antibodies that are simply not in it.</p></div>' + targetTable(F.gaps) + '</div>' +
      '<div class="card"><div class="section-title"><h2>Inducers and suppressors</h2></div><h3>Inducers (nothing in the graph acts on them)</h3><div class="tags">' + F.inducers.map(function (r) { return nodeBtn(r.node); }).join('') + '</div><h3>Raising these lowers pain</h3><div class="tags">' + F.suppressors.map(function (r) { return nodeBtn(r.node); }).join('') + '</div></div></div>';
    h += '<div class="card"><div class="section-title"><h2>Self-reinforcing loops</h2><p class="note">An even number of inhibitory links makes a loop amplify itself. ' + F.loops.n_pos_pairs + ' of ' + F.loops.n_pairs + ' two-node loops reinforce each other; ' + F.loops.n_pos_longer.toLocaleString() + ' of ' + F.loops.n_longer.toLocaleString() + ' longer loops are self-amplifying.</p></div><h3>Mutually reinforcing pairs</h3>' + F.loops.pairs.map(loopLine).join('') + '<h3>Strongest longer loops</h3>' + F.loops.longer.map(loopLine).join('') +
      '<h3>In the most amplifying loops</h3><div class="tags">' + F.loops.hubs.map(function (r) { return nodeBtn(r.node) + '<span class="mono muted" style="font-size:12px">' + r.count + '</span>'; }).join('') + '</div></div>';
    h += '<div class="card"><div class="section-title"><h2>Novel analgesic candidates</h2><p class="note">' + F.n_candidates + ' drugs with a net analgesic score, two or more independent first steps, 80% agreement and no direct pain link. Read this as a literature-weighted ranking, not a prediction (AUC ' + c.auc.toFixed(2) + ').</p></div>' + drugTable(F.candidates, true) + '</div>';
    $('#panel-findings').innerHTML = h;
  }

  /* ---------- guide ---------- */
  function renderGuide() {
    var c = F.calibration, m = F.meta;
    $('#panel-guide').innerHTML =
      '<div class="card"><h2>Who this is for</h2><ul class="plain">' +
      '<li><b>People with pain and their carers</b>: turn on Plain language and look up a treatment or a cause. The text says what the research reports, how many separate routes support it, and how much of it a person has checked.</li>' +
      '<li><b>Clinicians</b>: Explore shows a drug across all pain types at once; Connect &amp; compare puts several drugs side by side.</li>' +
      '<li><b>Researchers</b>: Pain types lists what drives each type and where a driver has no drug; Connect traces how one signal reaches another.</li>' +
      '<li><b>Drug discovery</b>: Rank filters drugs and targets by effect, route count, novelty (no direct pain link) and gaps (no inhibiting drug).</li>' +
      '<li><b>Curators</b>: Review ranks unchecked links by how much evidence runs through them and records your verdicts.</li>' +
      '<li><b>Funders and planners</b>: Landscape shows how deep the evidence is for each pain type.</li>' +
      '<li><b>Developers</b>: the scoring lives in <span class="mono">analysis/scripts/graph_inference.py</span>; this page repeats it in JavaScript and is checked against it.</li></ul></div>' +
      '<div class="card"><h2>How a result is computed</h2><ul class="plain">' +
      '<li>Every signed link reads “A raises B” (+) or “A lowers B” (−). A path’s sign is the product of its link signs, so a drug that lowers a mediator that raises pain lowers pain.</li>' +
      '<li>A path’s weight is the product of its link weights, scaled by ' + m.decay + ' for each extra link. Curated links weigh 0.6 to 0.95 by review status. Crawled links weigh more when more papers support them and less when the quote is hedged.</li>' +
      '<li>For each pain node of the chosen type the summed signed path weight is squashed with tanh, so a hub that fans out to many pain nodes cannot inflate a score. The score is the sum over those nodes.</li>' +
      '<li>Drugs use paths of up to ' + m.max_len + ' links, other nodes up to ' + m.target_len + '. Drugs are never intermediate steps.</li>' +
      '<li><b>Evidence settings.</b> All uses every signed link. Corroborated keeps curated links and crawled links backed by two or more papers whose quote is not hedged. Curated only keeps expert-curated links.</li></ul></div>' +
      '<div class="card"><h2>Pain types</h2><p class="note">A pain type is the set of pain nodes whose name matches a short list of words: mechanical (mechanical, tactile, touch, von Frey), cold (cold, thermal, heat), cancer, chemotherapy, diabetic, headache (migraine, trigeminal, orofacial), joint (arthritis, inflammatory, CFA), visceral (bladder, colitis, pelvic), central (spinal cord, stroke, post-surgical) and neuropathic (nerve injury, SNI, CCI). “Any pain” is the ' + m.core.length + ' pain nodes with the most evidence. Types with fewer than three pain nodes are left out, and a node can sit in several types.</p></div>' +
      '<div class="card"><h2>What the graph holds</h2><p>' + m.links.toLocaleString() + ' signed links over ' + m.nodes.toLocaleString() + ' nodes: ' + m.curated.toLocaleString() + ' curated and ' + m.crawled.toLocaleString() + ' crawled from papers and not yet reviewed. Another ' + m.unsigned.toLocaleString() + ' links (binds, interacts with) carry no direction and are shown on a node’s page but never scored. Left out of every score: ' +
      Object.keys(m.excluded).map(function (k) { return m.excluded[k] + ' ' + k.replace(/_/g, ' '); }).join(', ') + '.</p></div>' +
      '<div class="card"><h2>How far to trust it</h2><ul class="plain">' +
      '<li><b>Sign composition is mostly base rate.</b> Two-hop paths reproduce a direct link’s sign ' + pct(c.two_hop.all[0], c.two_hop.all[1]) + ' of the time, but the source node’s usual sign alone gets ' + pct(c.baselines.all_paths.source, c.baselines.all_paths.n) + ' (majority sign ' + Math.round(c.baselines.majority * 100) + '%, shuffled signs ' + Math.round(c.baselines.shuffled_all * 100) + '%). With paths from other papers only, composition scores ' + pct(c.baselines.independent_paths.composition, c.baselines.independent_paths.n) + ' against ' + pct(c.baselines.independent_paths.source, c.baselines.independent_paths.n) + '. Read a path as a pointer to evidence, not as a prediction.</li>' +
      '<li><b>Ranking drugs as analgesics is weak.</b> AUC ' + c.auc.toFixed(2) + ', and the method calls ' + Math.round(c.base_rate * 100) + '% of all drugs analgesic. The crawl is biased toward drugs studied as analgesics.</li>' +
      '<li><b>Opposite calls are informative.</b> The ' + F.pain_raising.length + ' drugs predicted to raise pain are mostly known inducers or off-target liabilities.</li>' +
      '<li><b>Hubs dominate.</b> TNF-α, TRPV1, NLRP3 and CGRP sit on most paths partly because they are studied most.</li>' +
      '<li><b>Thin pain types mislead.</b> Diabetic neuropathic pain has a handful of links; its rankings are pointers at most.</li>' +
      '<li><b>Animal and lab work dominates.</b> A path says what papers report, not what happens in a patient.</li>' +
      '<li><b>Errors exist.</b> A review of 504 links between curated nodes found 77% fully supported by their quote, 18% overstated, weak or context-limited, and 4.6% wrong. One example: a quote reading “patients with severe pain had <i>lower</i> TNFα” was coded as TNF lowering pain. That is what the Review tab is for.</li></ul></div>' +
      '<div class="card"><h2>Words used here</h2><dl class="gloss">' +
      '<dt>Score</dt><dd>Sum over pain nodes of tanh of the signed path weights. Negative lowers pain, positive raises it.</dd>' +
      '<dt>Independent steps</dt><dd>How many different first links out of the node carry the effect. More steps means the result does not hang on one paper.</dd>' +
      '<dt>Direct link</dt><dd>A link from the node straight to a pain node.</dd>' +
      '<dt>Novel</dt><dd>A drug with a computed effect and no direct link to pain.</dd>' +
      '<dt>Gap</dt><dd>A driver of pain that no drug in the graph inhibits.</dd>' +
      '<dt>Inducer</dt><dd>Something nothing in the graph acts on, such as an injury model or LPS.</dd>' +
      '<dt>Hedged</dt><dd>The quote says may, might, suggests or similar.</dd>' +
      '<dt>Curated and crawled</dt><dd>Curated links were entered and checked by hand. Crawled links were read from papers by software.</dd>' +
      '<dt>Impact (Review)</dt><dd>Summed weight of the drug-to-pain and injury-to-pain paths that use a link.</dd></dl></div>';
  }

  /* ---------- events, boot ---------- */
  var exp = null;
  function wireEvents() {
    document.addEventListener('click', function (ev) {
      var t = ev.target, b;
      if ((b = t.closest('[data-node]'))) { openNode(+b.dataset.node); return; }
      if ((b = t.closest('[data-setev]'))) { setEv(b.dataset.setev); return; }
      if ((b = t.closest('[data-role]'))) { var r = ROLES[+b.dataset.role], pre = {}; Object.keys(r.pre).forEach(function (k) { pre[k] = Array.isArray(r.pre[k]) ? r.pre[k].slice() : r.pre[k]; }); if (pre.sel === null) delete pre.sel; go(r.tab, pre); if (r.after) r.after(); return; }
      if ((b = t.closest('[data-act]'))) {
        var i = +b.dataset.i;
        if (b.dataset.act === 'connectFrom') { S.cmode = 'path'; S.cA = i; S.cB = null; go('connect'); }
        else { S.cmode = 'compare'; if (S.cmp.indexOf(i) < 0) S.cmp.push(i); S.cmp = S.cmp.slice(-5); go('connect'); }
        return;
      }
      if ((b = t.closest('[data-rm]'))) { S.cmp.splice(+b.dataset.rm, 1); renderCompare(); syncHash(); return; }
      if ((b = t.closest('[data-preset]'))) { S.cmp = ['morphine', 'gabapentin', 'duloxetine'].map(find).filter(function (x) { return x !== null; }); renderCompare(); syncHash(); return; }
      if ((b = t.closest('[data-fam]'))) { S.fam = b.dataset.fam; refresh(); return; }
      if ((b = t.closest('[data-typego]'))) { S.fam = b.dataset.typego; go('types'); return; }
      if ((b = t.closest('[data-rankgo]'))) { var k = b.dataset.rankgo; RK.kind = k.indexOf('drugs') === 0 ? 'drugs' : 'targets'; RK.dir = k === 'drugs-lower' ? 'lower' : 'raise'; RK.gap = k === 'targets-gap'; RK.novel = false; RK.q = ''; RK.min = 2; RK.shown = 50; go('rank'); return; }
    });
    $$('.tabs button').forEach(function (b) {
      b.addEventListener('click', function () { setTab(b.dataset.tab); });
      b.addEventListener('keydown', function (ev) {
        var j = TABS.indexOf(b.dataset.tab), d = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1 : 0;
        if (d) { ev.preventDefault(); var nb = $('#tab-' + TABS[(j + d + TABS.length) % TABS.length]); nb.focus(); setTab(TABS[(j + d + TABS.length) % TABS.length]); }
      });
    });
    $('#share').addEventListener('click', function () { syncHash(); copy(ARTIFACT_URL + '#' + hashFor(), 'Link'); });
    window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h !== hashFor() && applyHash()) setTab(S.tab); });
  }
  function boot(data, claude) {
    N = data[0]; E = data[1]; F = data[2]; FAM = data[3]; REV = data[4]; NS = F.meta.links;
    N.forEach(function (n, i) { n.nl = norm(n[1]); n.ns = norm(short(n[1])); n.words = n[1].toLowerCase().split(/[^a-z0-9α-ω]+/).filter(Boolean); bySlug[n[7]] = i; });
    FAM.families.forEach(function (f) { byFam[f.key] = f; });
    famOf = N.map(function () { return []; });
    FAM.families.forEach(function (f) { if (f.key !== 'any') f.outcomes.forEach(function (i) { famOf[i].push(f.key); }); });
    buildIndex(); buildRoles();
    S.plain = lsGet('pge.plain') === '1'; var ev = lsGet('pge.ev'); if (EVS.indexOf(ev) >= 0) S.ev = ev;
    $('#subtitle').textContent = F.meta.links.toLocaleString() + ' signed links between ' + F.meta.nodes.toLocaleString() + ' nodes. Find what the literature says raises or lowers pain, and see the quote behind each link.';
    wireBar();
    exp = makePicker($('#exp-picker'), { placeholder: 'Search a drug, target, cell, pathway or pain outcome', label: 'Search the graph', onPick: function (i) { S.sel = i; showNode(i); } });
    ['morphine', 'simvastatin', 'capsaicin', 'TNF-α', 'NLRP3', 'TLR4', 'electroacupuncture', 'PPAR-gamma'].forEach(function (name) { var hit = find(name); if (hit !== null) { var b = document.createElement('button'); b.className = 'chip'; b.textContent = name; b.addEventListener('click', function () { openNode(hit); }); $('#examples').appendChild(b); } });
    wireEvents();
    var fromHash = applyHash();
    setTab(fromHash ? S.tab : 'start');
    initStore(claude).then(function () { if (S.tab === 'review') renderReview(); });
  }
  var claude = window.claude && window.claude.use ? window.claude : null;
  var ready = Promise.all(['nodes.json', 'edges.json', 'findings.json', 'families.json', 'review.json'].map(function (f) { return fetch(f).then(function (r) { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); }); }))
    .then(function (d) { boot(d, claude); return true; })
    .catch(function (err) { $('#subtitle').textContent = 'The graph data did not load (' + err.message + '). Reload the page.'; return false; });
  window.Explorer = {
    ready: ready, state: S,
    analyze: function (i, fam, ev) { var a = analyze(i, ctx(fam || 'any', ev || 'all')); return { score: a.score, neg: a.neg, pos: a.pos, mediators: a.mediators, n_paths: a.paths.length, direct: a.direct, agreement: a.agreement }; },
    between: function (a, b, maxLen, ev) { var ps = between(a, b, maxLen, ev || 'all'); return { n: ps.length, net: ps.reduce(function (s, p) { return s + pathSign(p) * pathWeight(p); }, 0), pos: ps.filter(function (p) { return pathSign(p) > 0; }).length }; },
    rows: function (fam, ev) { return FAM.rows[fam + '|' + ev]; }, rowsAll: function () { return FAM.rows; },
    index: function (id) { return N.findIndex(function (n) { return n[0] === id; }); },
    votes: store
  };
})();
</script>
