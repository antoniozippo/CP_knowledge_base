# Curated edge-direction corrections for graphify-out/graph_v2.json.
#
# Applied by analysis/scripts/reverse_edges.py. Each entry names an existing
# signed link by its STORED (source, target, relation, sign). The relation
# describes an action of the stored TARGET on the stored SOURCE (a drug,
# tool, intervention, injury model or upstream regulator acting on the
# source), so read along source->target the sign drove the wrong node.
#
# action: reverse     swap source/target; relation and sign are kept (the
#                     sign was already correct for the corrected direction).
# action: neutralize  set sign to 0 because the corrected orientation is
#                     already encoded by another link (reversing would
#                     duplicate the pair).
#
# Every entry carries a verbatim dossier quote (byte substring of
# source_file, <=400 chars) supporting the corrected direction;
# source_location is the dossier line. claim_refs list edge claims whose
# verdicts independently flag the inversion or cover the edge.
# Validation statuses are never changed: a direction correction is not new
# evidence (e.g. the ACC Kalirin-7 downregulation edges stay REFUTED per
# theme_10 F10.1).
#
# Edges whose direction is ambiguous, or that need a sign/relation change
# rather than a pure reversal, are NOT listed here; see
# analysis/claims/edge_reversals_review.md.
