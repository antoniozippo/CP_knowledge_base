# Curated edge-direction corrections applied to graphify-out/graph_v2.json by
# analysis/scripts/reverse_edges.py.
#
# Each entry names a link as it is STORED (source, target, relation) whose
# relation describes the target acting on the source: an intervention, tool,
# injury model or upstream regulator was extracted as the link's target, so
# in simulation the source drove it instead of being driven by it. The tool
# swaps source and target and keeps the relation, whose sign
# (build_graph_v2.relation_sign) then reads correctly; `sign` overrides it
# only where the corrected target's state has inverted polarity.
#
# Every entry needs a verbatim `quote` from `source_file` stating the
# corrected direction. Links whose direction is ambiguous are not listed
# here; they are kept for human review in edge_direction_review.yaml.
# A direction fix is not new evidence: validation_status stays as it was.

