- pmid: '33131746'
  quote: an i.t. non-analgesic dose of AM1241 induces microglial activation and IL-1β TNF-α upregulation
    in SC and DRG via the CB2 receptor pathway
  was:
    subject: AM1241
    predicate: activates
    object: microglial activation
    sign: 1
  graph_was:
    source: CRAWLED_am1241
    target: CRAWLED_microglial_activation
  action: replace
  now:
    subject: Low-dose intrathecal AM1241 with morphine
    predicate: activates
    object: microglial activation
    sign: 1
  graph:
    source: CRAWLED_low_dose_intrathecal_am1241_with_morphine
    target: CRAWLED_microglial_activation
  new_node:
    name: Low-dose intrathecal AM1241 with morphine
    entity_type: drug
    compartment: dorsal_horn
  reason: 'Context dropped: Ma et al. 2021 gave rats with cancer pain daily intrathecal morphine, plus
    AM1241 at 0.03-0.07 ug, a dose the authors call non-analgesic. At that dose spinal and DRG TLR4, p38
    MAPK, microglial markers, IL-1b and TNF-alpha rose, through CB2. Filed under plain AM1241 the two
    links outweighed three papers showing anti-inflammatory effects at analgesic doses and turned AM1241
    pain-raising (+2.2; -8.9 without them). The finding moves to its own node.'
