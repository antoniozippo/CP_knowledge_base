# Corrections to relationships the extractor got wrong, found by the 2026-11 review of
# auto-crawled links (crawler/review/curated_links_review_2026-11.csv, verdict WRONG).
# crawler/correct_links.py applies them to crawler/extractions/<pmid>.json, so a re-merge
# reproduces them, and to graphify-out/graph_v2.json.
#
# action: drop     the relationship is removed (a null result or a co-occurrence, not an effect)
# action: replace  the relationship takes the fields in `now`; `graph` names the node ids the
#                  corrected link joins
# graph_was names the node ids of the link that holds the wrong relationship today.
#
# Two more review errors (Nav1.7 -> congenital insensitivity to pain, resiniferatoxin -> CGRP)
# are not listed: the extractor had the right sign (-1) and the predicate's fixed sign
# overrode it. crawler/extractor.py:normalize_sign now keeps such a sign, and
# correct_links.py re-applies that rule to links already in the graph.

- pmid: '41977367'
  quote: The transition from an excitatory GABAergic response to a mature inhibitory response is dependent
    upon the simultaneous down-regulation of NKCC1 and the up-regulation of KCC2
  was:
    subject: NKCC1
    predicate: downregulates
    object: KCC2
    sign: -1
  graph_was:
    source: KCC2_enhancers_new_NKCC1
    target: BDNF_TrkB_KCC2
  action: drop
  reason: 'Co-regulation, not an effect: NKCC1 falls and KCC2 rises together as GABA becomes inhibitory
    during maturation; the quote says nothing about NKCC1 repressing KCC2. The link keeps its other paper
    (41929507).'
- pmid: '35775903'
  quote: pre‐treatment with the TRPV1 antagonist A425619 (1 μM; Zhang et al., 2011) significantly attenuated
    the proportion of neurons responding to TNFα
  was:
    subject: TRPV1
    predicate: modulates
    object: TNF-alpha
    sign: 1
  graph_was:
    source: trpv1_trpv1
    target: TNF_TNF_alpha
  action: replace
  now:
    subject: TNF-alpha
    predicate: modulates
    object: TRPV1
    sign: 1
  graph:
    source: TNF_TNF_alpha
    target: trpv1_trpv1
  reason: 'Direction reversed: a TRPV1 antagonist reduced the neurons responding to TNF-alpha, so TNF-alpha
    acts through TRPV1. The evidence joins the existing TNF-alpha -> TRPV1 (+1) link; TRPV1 -> TNF-alpha
    keeps its other paper (37744324).'
