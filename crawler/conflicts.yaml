  reviewer_notes: 'Context-dependent, not a contradiction. PMID 36139484 is a review
    that states the context dependence itself: BDNF up-regulates KCC2 after spinal
    cord injury (its refs 3 and 97) and down-regulates it without injury (ref 108),
