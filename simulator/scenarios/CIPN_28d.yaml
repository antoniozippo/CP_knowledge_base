notes: >-
  Chemotherapy-induced peripheral neuropathy (paclitaxel-type). Mechanistically
  distinct from traumatic models: NO mechanical nerve lesion; axonal
  mitochondrial dysfunction and oxidative stress are the primary drivers, with
  TLR4-dependent glial activation. Seeds emphasize the axonal-mitotoxic axis
  (mitochondrial dysfunction, ROS) plus TLR4/TNF/IL-6 neuroinflammation; BDNF
  and MMP-9 seeded lower than SNI/CCI reflecting their secondary role.
  Sustained drives model a fractional dosing schedule: tonic ROS/mitochondrial/
  TNF elevation during the treatment window only (ticks 0-11), so the
  post-treatment trajectory probes partial reversibility versus persistence,
  the clinically decisive question for CIPN.
