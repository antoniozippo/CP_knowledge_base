notes: >-
  SNI pilot scenario. Seeds are proximal injury drivers resolved against the
  real card set: microglial activation, TNF-alpha, ROS/oxidative stress,
  MMP-9, BDNF, HIF1-alpha. No DAMP card exists in the set; its canonical
  receptor TLR4 (tlr4_tlr4) is seeded as the DAMP-signaling proxy. Seed
  magnitude 0.92: orphan nodes contract toward baseline by a factor of
  ~0.637 per tick, so only seeds >= ~0.87 satisfy first_crossing with
  delta=0.15 and sustain=2 for two consecutive logged ticks.
  Sustained drives model tonic injury drivers after SNI: ongoing ectopic
  afferent firing and persistent glial activation keep microglia and TNF-a
  elevated through the whole horizon (value 0.9 from tick 0, no end tick =
  active while start <= tick < horizon).
